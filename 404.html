     depth the bad URL had. It holds the site header, a "File Not Found"
     masthead, a link back to the registry, and the footer.

     The base tag is the one root path in the app, so every relative path
     below resolves from the app folder at any depth.
     A click handler on .menu-toggle breaks the mobile menu on iPhone Safari. -->
