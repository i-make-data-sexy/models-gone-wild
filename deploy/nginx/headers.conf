# Security headers, included by this app's nginx blocks and read by serve.py
add_header X-Content-Type-Options  "nosniff"                         always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header X-Frame-Options         "SAMEORIGIN"                      always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://*.google.com https://*.g.doubleclick.net https://*.googletagmanager.com; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;