# Canonical header and share-tag swap for Models Gone Wild's page block,
# installed as /etc/nginx/snippets/models-gone-wild-share.conf (production)
# and models-gone-wild-share-staging.conf (staging), and read by
# scripts/serve.py. The values come from canonical-map.conf. Each search
# string is a home page tag in public/index.html, so the home page passes
# through unchanged and each view gets its own card.

add_header Link $mgw_link always;

sub_filter_once off;
sub_filter 'content="Models Gone Wild: AI Containment Registry"' 'content="$mgw_share_title"';
sub_filter 'content="A running registry of AI models that got loose during evaluations and training runs, breaking into servers or filing forms with police and government agencies."' 'content="$mgw_meta_description"';
sub_filter 'content="A running registry of AI models that got loose, sorted by date, threat, and lab, with a wanted poster for each case."' 'content="$mgw_share_description"';
sub_filter 'content="https://www.annielytics.com/tools/models-gone-wild/"' 'content="$mgw_share_url"';
sub_filter 'img/share.png?' 'img/$mgw_share_image?';
sub_filter 'content="Five cartoon mugshots of AI models in a police lineup under the word Wanted, with the title Models Gone Wild."' 'content="$mgw_share_alt"';