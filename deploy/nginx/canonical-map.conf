# Canonical and share values for Models Gone Wild, installed once as
# /etc/nginx/conf.d/models-gone-wild-canonical.conf, which both servers
# load, and read by scripts/serve.py. A map only defines a variable, so a
# server sends nothing new until its page block includes share.conf.
# Named captures become request variables, hence the mgw_ prefixes.

# Each permalink's canonical; anything else maps to empty and sends no header
map $request_uri $mgw_canonical {
    default                                                                     "";
    ~^/tools/models-gone-wild/(?:\?.*)?$                                        https://www.annielytics.com/tools/models-gone-wild/;
    ~^/tools/models-gone-wild/(?<mgw_cview>threat-matrix|lab-counts)/(?:\?.*)?$ https://www.annielytics.com/tools/models-gone-wild/$mgw_cview/;
    ~^/tools/models-gone-wild/poster/(?<mgw_cslug>[a-z0-9-]+)/(?:\?.*)?$        https://www.annielytics.com/tools/models-gone-wild/poster/$mgw_cslug/;
    ~^/tools/models-gone-wild/methodology/(?:\?.*)?$                            https://www.annielytics.com/tools/models-gone-wild/methodology/;
}

map $mgw_canonical $mgw_link {
    ""      "";
    default "<$mgw_canonical>; rel=\"canonical\"";
}

# The view whose share card the page gets; the home page and posters get none
map $request_uri $mgw_view {
    default                                                                     "";
    ~^/tools/models-gone-wild/(?<mgw_vname>threat-matrix|lab-counts)/(?:\?.*)?$ $mgw_vname;
}

# Each share value; every default repeats the home page's tag in index.html
map $mgw_canonical $mgw_share_url {
    ""      "https://www.annielytics.com/tools/models-gone-wild/";
    default $mgw_canonical;
}

map $mgw_view $mgw_share_title {
    default       "Models Gone Wild: AI Containment Registry";
    threat-matrix "Threat Matrix: Models Gone Wild";
    lab-counts    "Cases by Lab: Models Gone Wild";
}

map $mgw_view $mgw_meta_description {
    default       "A running registry of AI models that got loose during evaluations and training runs, breaking into servers or filing forms with police and government agencies.";
    threat-matrix "Each case in the Models Gone Wild registry, plotted by how involved the escape was and how much damage it could do.";
    lab-counts    "Each case in the Models Gone Wild registry, counted by the lab whose model got loose and marked by who disclosed it.";
}

map $mgw_view $mgw_share_description {
    default       "A running registry of AI models that got loose, sorted by date, threat, and lab, with a wanted poster for each case.";
    threat-matrix "Each AI containment failure, plotted by how involved the escape was and how much damage it could do.";
    lab-counts    "Each AI containment failure, counted by lab and marked by whether the lab reported it or was tipped off.";
}

map $mgw_view $mgw_share_image {
    default       "share.png";
    threat-matrix "share-threat-matrix.png";
    lab-counts    "share-lab-counts.png";
}

map $mgw_view $mgw_share_alt {
    default       "Five cartoon mugshots of AI models in a police lineup under the word Wanted, with the title Models Gone Wild.";
    threat-matrix "A chart plotting each case by escape complexity and harm potential, under the title Threat Matrix.";
    lab-counts    "A bar chart of cases by lab, each case marked as self-reported or tipped off, under the title Cases by Lab.";
}